name: Build and deploy to Azure Container App

on:
  push:
    branches:
      - master  # This matches your branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr login --name jimmydev2026
          # Replace 'MyProjectFolder' with the actual folder name where your Dockerfile lives
          docker build ./MyProjectFolder -t jimmydev2026.azurecr.io/jimmydev2026-app:${{ github.sha }}
          docker push jimmydev2026.azurecr.io/jimmydev2026-app:${{ github.sha }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: React-DotNet-App-Resource-Group
          containerAppName: jimmydev2026-app
          imageToDeploy: jimmydev2026.azurecr.io/jimmydev2026-app:${{ github.sha }}