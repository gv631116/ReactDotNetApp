name: Build and deploy to Azure Container App

on:
  push:
    branches:
      - master  # Matches your specific branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the code from your repository
      - name: Checkout to the branch
        uses: actions/checkout@v4

      # 2. Log in to Azure using the Service Principal JSON secret
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Log in to ACR using Admin credentials (prevents DNS/Host errors)
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: jimmydev2026.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 4. Build the image using the Server subfolder path
      - name: Build and push image to ACR
        run: |
          docker build . -f ReactDotNetApp.Server/Dockerfile -t jimmydev2026.azurecr.io/jimmydev2026-app:${{ github.sha }}
          docker push jimmydev2026.azurecr.io/jimmydev2026-app:${{ github.sha }}

      # 5. Tell Azure Container Apps to pull the new image
      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: React-DotNet-App-Resource-Group
          containerAppName: jimmydev2026-app
          imageToDeploy: jimmydev2026.azurecr.io/jimmydev2026-app:${{ github.sha }}